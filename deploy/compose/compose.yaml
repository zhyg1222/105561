name: xiaojuju-agent

services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - "${XJJ_STACK_DATA}/postgres:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:9.1.2
    command: ["valkey-server", "--appendonly", "yes", "--requirepass", "${VALKEY_PASSWORD}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - "${XJJ_STACK_DATA}/valkey:/data"
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - "${XJJ_STACK_DATA}/neo4j/data:/data"
      - "${XJJ_STACK_DATA}/neo4j/logs:/logs"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD} 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 30

  opa:
    image: openpolicyagent/opa:1.21.4
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    ports:
      - "127.0.0.1:8181:8181"
    volumes:
      - "../opa/policies:/policies:ro"
    healthcheck:
      test: ["CMD", "/opa/opa", "eval", "true"]
      interval: 5s
      timeout: 3s
      retries: 20