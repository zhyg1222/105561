<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小居居 AI 标识</title>
<style>
  html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
  .badge{position:fixed;left:24px;bottom:24px;display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:999px;background:rgba(12,16,24,.78);color:#fff;font:600 22px/1.2 "Microsoft YaHei",sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.25);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18)}
  .dot{width:10px;height:10px;border-radius:50%;background:#5eead4;box-shadow:0 0 12px #5eead4}
  .sub{font-size:13px;font-weight:400;opacity:.72;margin-left:4px}
</style>
</head>
<body>
<div class="badge"><span class="dot"></span><span>小居居</span><span class="sub">AI智能体 · 非真人</span></div>
</body>
</html>
